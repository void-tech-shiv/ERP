name: Attendly Mobile CI
on:
  push:
    branches: [attendly-mobile-mvp]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
jobs:
  mobile-check:
    name: Expo TypeScript and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and URL policies
        run: npm run check
      - name: Verify Expo package compatibility
        run: npx expo install --check
