name: Cloudflare compatibility check

on:
  push:
    branches: [attendly-cloudflare-preview]
  workflow_dispatch:

jobs:
  vinext-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Next.js frontend
        run: npm install --no-audit --no-fund
      - name: Check vinext compatibility
        run: npx --yes vinext check
      - name: Initialize Cloudflare adapter without replacing Next.js
        run: npx --yes vinext init --platform=cloudflare --name attendly-cloudflare-preview --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Build Cloudflare Worker bundle
        run: npm run build:vinext
