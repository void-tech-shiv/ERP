name: Cloudflare staging smoke test
on:
  push:
    branches: [attendly-cloudflare-preview]
    paths:
      - '.github/workflows/cloudflare-smoke.yml'
      - 'mobile/.env.example'
  workflow_dispatch:

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare homepage
        run: |
          set -eu
          URL='https://attendly-cloudflare-preview.void-tech-shiv.workers.dev/'
          curl -fsSL --retry 2 --max-time 40 "${URL}" -o homepage.html
          if ! grep -Eiq 'attendly|Every class counts' homepage.html; then
            echo 'Homepage did not contain Attendly branding'
            exit 1
          fi
          echo 'Cloudflare staging homepage responded with Attendly content.'
      - name: Verify unauthenticated ERP session is disabled in staging
        run: |
          set -eu
          URL='https://attendly-cloudflare-preview.void-tech-shiv.workers.dev/api/erp/session'
          STATUS=$(curl -sS -o session-response.json -w '%{http_code}' --max-time 40 "${URL}")
          echo "Private ERP session API returned HTTP ${STATUS}"
          test "${STATUS}" = '503'
